name: Build PCSX2X6 Modern Netplay

on:
  push:
    branches:
      - "feature/pcsx2x6-modern-netplay"
  workflow_dispatch:

concurrency:
  group: pcsx2x6-netplay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout build-control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout current PCSX2X6 master
        uses: actions/checkout@v4
        with:
          repository: PS2Homebrew-arcade/pcsx2x6
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Record build revisions
        shell: pwsh
        run: |
          git -C src rev-parse HEAD | Tee-Object -FilePath control\PCSX2X6_UPSTREAM_SHA.txt
          git -C src describe --tags --always | Tee-Object -FilePath control\PCSX2X6_UPSTREAM_VERSION.txt
          git -C control rev-parse HEAD | Tee-Object -FilePath control\NETPLAY_CONTROL_SHA.txt

      - name: Apply Modern Netplay to PCSX2X6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\pcsx2\Netplay | Out-Null
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.h src\pcsx2\Netplay\ModernNetplay.h -Force
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.cpp src\pcsx2\Netplay\ModernNetplay.cpp -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.h src\pcsx2-qt\NetplayDialog.h -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.cpp src\pcsx2-qt\NetplayDialog.cpp -Force
          Copy-Item control\overlay-pcsx2x6\pcsx2\DEV9\ACJV.cpp src\pcsx2\DEV9\ACJV.cpp -Force
          & control\scripts\apply-pcsx2x6-netplay.ps1 -SourceRoot (Resolve-Path src)
          git -C src diff --check
          git -C src diff -- pcsx2/SIO/Pad/Pad.cpp pcsx2/SIO/Pad/PadDualshock2.cpp pcsx2/VMManager.cpp pcsx2/Patch.cpp pcsx2/CMakeLists.txt pcsx2-qt/MainWindow.cpp pcsx2-qt/AutoUpdaterDialog.cpp pcsx2-qt/QtHost.cpp pcsx2-qt/CMakeLists.txt

      - name: Restore PCSX2X6 Windows dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: src/deps
          key: pcsx2x6-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Build PCSX2X6 Windows dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: src
        env:
          DEBUG: 0
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Save PCSX2X6 Windows dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/deps
          key: pcsx2x6-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Download PCSX2 patch database
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path bin\resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip" -OutFile "bin\resources\patches.zip"

      - name: Configure and build release
        shell: cmd
        working-directory: src
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          call "%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake . -B build "-DCMAKE_PREFIX_PATH=%cd%\deps" -DQT_BUILD=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DDISABLE_ADVANCE_SIMD=ON -G Ninja || exit /b 1
          cmake --build build --config Release || exit /b 1
          cmake --install build --config Release || exit /b 1

      - name: Package PCSX2X6 Netplay test build
        shell: pwsh
        run: |
          Copy-Item control\PCSX2X6_UPSTREAM_SHA.txt src\bin\PCSX2X6_UPSTREAM_SHA.txt -Force
          Copy-Item control\PCSX2X6_UPSTREAM_VERSION.txt src\bin\PCSX2X6_UPSTREAM_VERSION.txt -Force
          Copy-Item control\NETPLAY_CONTROL_SHA.txt src\bin\NETPLAY_CONTROL_SHA.txt -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.ps1 src\bin\Collect-Netplay-Diagnostics.ps1 -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.bat src\bin\Collect-Netplay-Diagnostics.bat -Force
          @"
          PCSX2X6 Modern Netplay - integration build
          =========================================
          Base: PS2Homebrew-arcade/pcsx2x6 master
          Netplay protocol: current control-branch protocol
          Status: core PCSX2 Netplay integration compile validation.
          Arcade JVS authoritative-input synchronization is developed in the same branch and must be validated before this target is considered complete.
          "@ | Set-Content -Encoding UTF8 src\bin\NETPLAY_BUILD_INFO.txt

      - name: Upload Windows x64 PCSX2X6 Netplay build
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2X6-modern-netplay-windows-x64-integration
          path: src/bin
          if-no-files-found: error
          retention-days: 14
