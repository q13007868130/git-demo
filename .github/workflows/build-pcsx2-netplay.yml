name: Build PCSX2 Modern Netplay

on:
  push:
    branches:
      - master
      - "feature/pcsx2-modern-netplay"
  workflow_dispatch:

concurrency:
  group: pcsx2-netplay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-only]') }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout build-control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout current PCSX2 master
        uses: actions/checkout@v4
        with:
          repository: PCSX2/pcsx2
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Record build revisions
        shell: pwsh
        run: |
          git -C src rev-parse HEAD | Tee-Object -FilePath control\PCSX2_UPSTREAM_SHA.txt
          git -C src describe --tags --always | Tee-Object -FilePath control\PCSX2_UPSTREAM_VERSION.txt
          git -C control rev-parse HEAD | Tee-Object -FilePath control\NETPLAY_CONTROL_SHA.txt

      - name: Apply Modern Netplay all-in-one multiplayer build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\pcsx2\Netplay | Out-Null
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.h src\pcsx2\Netplay\ModernNetplay.h -Force
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.cpp src\pcsx2\Netplay\ModernNetplay.cpp -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.h src\pcsx2-qt\NetplayDialog.h -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.cpp src\pcsx2-qt\NetplayDialog.cpp -Force
          & control\scripts\apply-modern-netplay.ps1 -SourceRoot (Resolve-Path src)
          git -C src diff --check
          git -C src diff -- pcsx2/SIO/Pad/Pad.cpp pcsx2/SIO/Pad/PadDualshock2.cpp pcsx2/VMManager.cpp pcsx2/CMakeLists.txt pcsx2-qt/MainWindow.cpp pcsx2-qt/AutoUpdaterDialog.cpp pcsx2-qt/QtHost.cpp pcsx2-qt/CMakeLists.txt

      - name: Restore PCSX2 Windows dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: src/deps
          key: pcsx2-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Build PCSX2 Windows dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: src
        env:
          DEBUG: 0
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Save PCSX2 Windows dependencies immediately
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/deps
          key: pcsx2-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Download PCSX2 patch database
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path bin\resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip" -OutFile "bin\resources\patches.zip"

      - name: Configure and build release
        shell: cmd
        working-directory: src
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          call "%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake . -B build "-DCMAKE_PREFIX_PATH=%cd%\deps" -DQT_BUILD=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DDISABLE_ADVANCE_SIMD=ON -G Ninja || exit /b 1
          cmake --build build --config Release || exit /b 1
          cmake --install build --config Release || exit /b 1

      - name: Package Netplay launchers, diagnostics and metadata
        shell: pwsh
        run: |
          Copy-Item control\PCSX2_UPSTREAM_SHA.txt src\bin\PCSX2_UPSTREAM_SHA.txt -Force
          Copy-Item control\PCSX2_UPSTREAM_VERSION.txt src\bin\PCSX2_UPSTREAM_VERSION.txt -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.ps1 src\bin\Collect-Netplay-Diagnostics.ps1 -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.bat src\bin\Collect-Netplay-Diagnostics.bat -Force
          Copy-Item control\NETPLAY_CONTROL_SHA.txt src\bin\NETPLAY_CONTROL_SHA.txt -Force
          # Keep every Netplay install self-contained. This prevents two PCs from
          # silently reading different Documents/AppData configurations.
          New-Item -ItemType File -Force -Path src\bin\portable.txt | Out-Null
          $updaterText = Get-Content control\scripts\Update-Netplay.ps1 -Raw
          $updaterText | Set-Content -Encoding utf8BOM src\bin\Update-Netplay.ps1
          Copy-Item control\scripts\Update-Netplay.bat src\bin\Update-Netplay.bat -Force
          $channel = if ($env:GITHUB_REF -eq "refs/heads/master") { "stable" } else { "test" }
          $channel | Set-Content -Encoding ASCII src\bin\NETPLAY_UPDATE_CHANNEL.txt
          @"
          PCSX2 Modern Netplay - deterministic dual-track build
          =================================================
          Base: current PCSX2 master at build time (exact SHA in PCSX2_UPSTREAM_SHA.txt)
          Protocol: startup environment fingerprint + host-authoritative multiplayer + runtime controls
          Transport: reliable TCP
          Default port: 27886/TCP

          Included in this single test build:
          - v0.5b-r8: every connected player can switch which logical P1-P4 controller they own before boot or during gameplay; occupied positions are swapped by the host.
          - v0.5b-r8: host can change input delay from 1-100 frames while the game is running; no process/game restart is required.
          - v0.5b-r8: host can switch Multitap compatibility live between controller-port-1 layout (BMX/downhill style) and controller-port-2 layout (START-to-join style).
          - v0.5b-r8: live changes briefly pause every VM, reload the same pad topology, reset to a new input epoch, then resume through the first-poll barrier.
          - v0.5b-r8: input/bundle packets carry an epoch so old in-flight packets cannot contaminate the new timeline.
          - v0.5b-r8: Netplay windows are modeless/unowned, so the game window stays clickable and the Netplay UI may remain in the background.
          - v0.5b-r7: fix 3P/4P games which require START to join by preserving P2 on normal controller port 2.
          - v0.5b-r7: move the 3P/4P Multitap to controller port 2; mapping is now P1=0, P2=1, P3=5, P4=6.
          - v0.5b-r7: protocol bumped to v5 so older slot-topology builds cannot silently mix with this build.
          - v0.5b-r7: this follows the legacy PCSX2 Online pad ordering, while keeping the already-working 1P/2P behavior unchanged.
          - v0.5b-r6: input-delay range raised from 1-12 to 1-100 frames on host and client protocol validation.
          - v0.5b-r6: input/bundle history retention now scales with selected delay so 100-frame rooms do not prune needed frames.
          - v0.5b-r6: stock PCSX2 automatic/manual updater is hard-disabled in the custom Netplay binary.
          - v0.5b-r6: the normal "Check for Updates" action now explains why official updates are blocked and launches the Netplay updater instead.
          - v0.5b-r6: Netplay update builds still checkout current PCSX2 master, so updating Netplay also updates the PCSX2 base.
          - v0.5b-r6: rolling GitHub Release is created against master so GITHUB_TOKEN no longer hits the workflow-file release 403 on feature builds.
          - v0.5b-r5: if any player drops during a running session, all remaining players receive SESSION_ABORT, the VM is paused, and a Chinese disconnect/sync-error dialog is shown.
          - v0.5b-r5: input/bundle synchronization timeouts also pause the game and show a visible warning instead of silently leaving machines diverged.
          - v0.5b-r5: stock PCSX2 update checking remains available, but official "Download and Install" is blocked because it would overwrite Netplay.
          - v0.5b-r5: new "联机 → 检查联机版更新..." downloads only our rolling Netplay package, rebuilt on top of current PCSX2 master.
          - v0.5b-r5: updater overlays program-package files only and does not delete BIOS, memory cards, games, screenshots, saves, or user configuration.
          - v0.5b-r4: synchronize the complete 18-byte DualShock2 response, not only the legacy 6 bytes.
          - v0.5b-r4: adds the 12 pressure-sensitive button bytes (D-pad, face buttons, L1/R1/L2/R2); this targets games such as 爆走マウンテンバイカーズ which can use pressure values for menu/game transitions.
          - v0.5b-r4: protocol bumped to v4; all players must use the same r4 build.
          - v0.5b-r4: log local digital/pressure transitions to make game-specific desyncs diagnosable without logging every analog sample.
          - v0.5b-r4: still builds against current PCSX2 master at CI build time.
          - v0.5b-r3: fix Windows Unicode/Chinese memory-card paths by using PCSX2 FileSystem APIs instead of narrow std::ifstream/std::ofstream.
          - v0.5b-r3: shadow-card creation and cleanup also use PCSX2 UTF-8-aware filesystem APIs.
          - v0.5b-r2: fix real Slot 1 file/folder detection before VM boot.
          - v0.5b-r2: memory-card errors cancel only the current Start attempt; the room remains reusable.
          - v0.5b-r2: add “重建连接” and automatic failed-lobby recovery without restarting PCSX2.
          - v0.5b-r2: client connect has a short timeout and automatically retries before synchronized boot.
          - v0.5b-r2: pre-boot player disconnect frees its P-slot instead of poisoning the room.
          - v0.5b-r2: VM/Pad shutdown no longer destroys the Netplay backend.
          - v0.5b-r2: temporary Shadow cards are removed when the backend is rebuilt/stopped.
          - v0.5b-r2: generic errors no longer display misleading stale WSA codes.
          - Compact Chinese setup UI: separate Create Room / Join Room tabs.
          - Dedicated Chinese lobby instead of one oversized all-in-one settings page.
          - Host chooses the game only after entering the room; selection opens a separate game-list dialog.
          - Strict Serial + CRC matching on every player before launch.
          - Synchronized PREPARE_BOOT / BOOT_READY / START_COMMIT / FIRST_POLL_GO barriers.
          - 1-4 player rooms. P1 is host; P2-P4 are network clients.
          - 3-4 player rooms automatically enable Multitap on controller port 2 and use PCSX2 slots P1=0, P2=1, P3=5, P4=6.
          - Host-authoritative input bundles: every poll waits for all configured players, then the same bundle is broadcast to every PC.
          - Shadow memory-card synchronization. Host slot 1 is exported before boot and transferred to every player.
          - Both host and clients run from NetplayShadow-<session>.ps2, so the user's original card is not overwritten by the Netplay session.
          - Folder memory cards are exported to a raw shadow card; file memory cards are copied directly.
          - No-card state is synchronized as well.
          - Player table shows P1-P4, names, game match, memory-card state and boot-ready state.
          - Session ID is shown in the room and recorded in logs for multi-machine diagnosis.
          - Existing stall logging and one-click diagnostic ZIP collection remain included.

          Test order:
          1. Start with 2 players and Memory Card Sync enabled.
          2. Confirm the room reaches 2/2.
          3. Host clicks “选择游戏并开始...”, chooses a game once, and then does nothing else.
          4. Both machines must automatically match, synchronize the shadow card, launch the same game and wait at the boot barriers.
          5. Test save/load inside the game and verify the original host memory-card file is unchanged after the session.
          6. Then test 3-player and 4-player games which support PS2 Multitap.
          7. If any player desyncs or stalls, run Collect-Netplay-Diagnostics.bat on every participating PC and keep all ZIPs.

          No BIOS or game image is included.
          "@ | Set-Content -Encoding UTF8 src\bin\NETPLAY_BUILD_INFO.txt

          @'
          @echo off
          setlocal
          set "PCSX2_NETPLAY_MODE=host"
          set "PCSX2_NETPLAY_USERNAME=Host"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_PLAYERS=2"
          set "PCSX2_NETPLAY_DELAY=2"
          set "PCSX2_NETPLAY_MEMCARD_SYNC=1"
          set "PCSX2_NETPLAY_SHOW_LOBBY=1"
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Host.bat

          @'
          @echo off
          setlocal
          set /p "NETPLAY_HOST=Host IPv4 or hostname: "
          if "%NETPLAY_HOST%"=="" exit /b 1
          set "PCSX2_NETPLAY_MODE=client"
          set "PCSX2_NETPLAY_USERNAME=Player"
          set "PCSX2_NETPLAY_HOST=%NETPLAY_HOST%"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_SHOW_LOBBY=1"
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Join.bat

      - name: Upload Windows x64 Netplay build
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-modern-netplay-windows-x64-v0.5b-r8
          path: src/bin
          if-no-files-found: error
          retention-days: 14

      - name: Prepare rolling Netplay update package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "PCSX2-modern-netplay-windows-x64.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path src\bin\* -DestinationPath $archive -CompressionLevel Optimal
          $channel = if ($env:GITHUB_REF -eq "refs/heads/master") { "stable" } else { "test" }
          $manifest = [ordered]@{
            version = "v0.5b-r8"
            channel = $channel
            control_sha = (Get-Content control\NETPLAY_CONTROL_SHA.txt -Raw).Trim()
            upstream_sha = (Get-Content control\PCSX2_UPSTREAM_SHA.txt -Raw).Trim()
            sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash
            asset_name = "PCSX2-modern-netplay-windows-x64.zip"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 $env:RUNNER_TEMP\NETPLAY_UPDATE_MANIFEST.json

      - name: Publish rolling Netplay update
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/netplay-v0.5b-multiplayer-memcard-ui'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: q13007868130/git-demo
        run: |
          $channel = if ($env:GITHUB_REF -eq "refs/heads/master") { "stable" } else { "test" }
          $tag = if ($channel -eq "stable") { "netplay-latest" } else { "netplay-test-latest" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag -y
          }
          $upstream = (Get-Content control\PCSX2_UPSTREAM_SHA.txt -Raw).Trim()
          $notes = "Modern Netplay rolling $channel update.\n\nControl-SHA: $env:GITHUB_SHA\nUpstream-SHA: $upstream"
          if ($channel -eq "test") {
            gh release create $tag "$env:RUNNER_TEMP\PCSX2-modern-netplay-windows-x64.zip" "$env:RUNNER_TEMP\NETPLAY_UPDATE_MANIFEST.json" --target master --title "PCSX2 Modern Netplay Test Update" --notes $notes --prerelease
          } else {
            gh release create $tag "$env:RUNNER_TEMP\PCSX2-modern-netplay-windows-x64.zip" "$env:RUNNER_TEMP\NETPLAY_UPDATE_MANIFEST.json" --target master --title "PCSX2 Modern Netplay Latest" --notes $notes
          }


  release-only-repair:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-only]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Recover successful r5 artifact from Build 24
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: q13007868130/git-demo
        run: |
          set -euo pipefail
          mkdir recovered
          gh run download 35336516275 -n PCSX2-modern-netplay-windows-x64-v0.5b-r8 -D recovered
          test -f recovered/pcsx2-qt.exe
          test -f recovered/NETPLAY_CONTROL_SHA.txt
          test -f recovered/PCSX2_UPSTREAM_SHA.txt

      - name: Rebuild rolling update archive and manifest
        shell: pwsh
        run: |
          Compress-Archive -Path recovered/* -DestinationPath "$env:RUNNER_TEMP/PCSX2-modern-netplay-windows-x64.zip" -CompressionLevel Optimal
          $manifest = [ordered]@{
            version = "v0.5b-r8"
            channel = "test"
            control_sha = (Get-Content recovered/NETPLAY_CONTROL_SHA.txt -Raw).Trim()
            upstream_sha = (Get-Content recovered/PCSX2_UPSTREAM_SHA.txt -Raw).Trim()
            sha256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/PCSX2-modern-netplay-windows-x64.zip").Hash
            asset_name = "PCSX2-modern-netplay-windows-x64.zip"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/NETPLAY_UPDATE_MANIFEST.json"

      - name: Publish repaired rolling test update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: q13007868130/git-demo
        run: |
          set -euo pipefail
          gh release view netplay-test-latest >/dev/null 2>&1 && gh release delete netplay-test-latest --cleanup-tag -y || true
          gh release create netplay-test-latest             "$RUNNER_TEMP/PCSX2-modern-netplay-windows-x64.zip"             "$RUNNER_TEMP/NETPLAY_UPDATE_MANIFEST.json"             --target master             --title "PCSX2 Modern Netplay Test Update"             --notes "Recovered v0.5b-r5 build. Rolling updater publication repaired."             --prerelease
