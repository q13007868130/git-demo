name: Build PCSX2 Modern Netplay

on:
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout build-control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout current PCSX2 master
        uses: actions/checkout@v4
        with:
          repository: PCSX2/pcsx2
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Record upstream revision
        shell: pwsh
        working-directory: src
        run: |
          git rev-parse HEAD | Tee-Object -FilePath ..\control\PCSX2_UPSTREAM_SHA.txt
          git describe --tags --always | Tee-Object -FilePath ..\control\PCSX2_UPSTREAM_VERSION.txt

      - name: Apply Modern Netplay port and Qt UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\pcsx2\Netplay | Out-Null
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.h src\pcsx2\Netplay\ModernNetplay.h -Force
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.cpp src\pcsx2\Netplay\ModernNetplay.cpp -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.h src\pcsx2-qt\NetplayDialog.h -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.cpp src\pcsx2-qt\NetplayDialog.cpp -Force
          & control\scripts\apply-modern-netplay.ps1 -SourceRoot (Resolve-Path src)
          git -C src diff --check
          git -C src diff -- pcsx2/SIO/Pad/Pad.cpp pcsx2/SIO/Pad/PadDualshock2.cpp pcsx2/CMakeLists.txt pcsx2-qt/MainWindow.cpp pcsx2-qt/CMakeLists.txt

      - name: Cache PCSX2 Windows dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: src/deps
          key: pcsx2-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Build PCSX2 Windows dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: src
        env:
          DEBUG: 0
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Download PCSX2 patch database
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path bin\resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip" -OutFile "bin\resources\patches.zip"

      - name: Configure and build release
        shell: cmd
        working-directory: src
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          call "%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake . -B build "-DCMAKE_PREFIX_PATH=%cd%\deps" -DQT_BUILD=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DDISABLE_ADVANCE_SIMD=ON -G Ninja || exit /b 1
          cmake --build build --config Release || exit /b 1
          cmake --install build --config Release || exit /b 1

      - name: Package Netplay launchers and metadata
        shell: pwsh
        run: |
          Copy-Item control\PCSX2_UPSTREAM_SHA.txt src\bin\PCSX2_UPSTREAM_SHA.txt -Force
          Copy-Item control\PCSX2_UPSTREAM_VERSION.txt src\bin\PCSX2_UPSTREAM_VERSION.txt -Force
          @"
          PCSX2 Modern Netplay v0.2
          =========================
          Base: current PCSX2 master at build time (exact SHA in PCSX2_UPSTREAM_SHA.txt)
          Netplay model: two-player delay-based lockstep at the DS2 SIO/PAD response boundary
          Synced input: 2 digital bytes + 4 analog bytes, matching the classic PCSX2 Online design
          Transport: reliable TCP proof-of-port implementation
          Default port: 27886/TCP
          Input delay: host selectable from 1 to 12 frames in the built-in Netplay UI

          New in v0.2:
          - Built-in 联机 (Netplay) menu in the PCSX2 Qt menu bar.
          - Create/Join dialog with host address, port, and input-delay controls.
          - Host is authoritative for delay; the joining peer follows the host during handshake.
          - Delay guidance for LAN, medium-distance, and high-latency connections.
          - UI restarts PCSX2 with the selected Netplay environment before PAD initialization,
            preserving the already-proven v0.1 synchronization path.
          - Dependency caching in CI so later Netplay iterations should build much faster.

          Netplay-Host.bat and Netplay-Join.bat remain included as fallback launchers.
          No BIOS or game image is included.
          "@ | Set-Content -Encoding UTF8 src\bin\NETPLAY_BUILD_INFO.txt

          @'
          @echo off
          setlocal
          set "PCSX2_NETPLAY_MODE=host"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_DELAY=2"
          echo ============================================================
          echo PCSX2 Modern Netplay v0.2 - HOST fallback launcher
          echo TCP port: %PCSX2_NETPLAY_PORT%   Input delay: %PCSX2_NETPLAY_DELAY%
          echo The built-in Netplay menu is recommended for normal use.
          echo ============================================================
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Host.bat

          @'
          @echo off
          setlocal
          set /p "NETPLAY_HOST=Host IPv4 or hostname: "
          if "%NETPLAY_HOST%"=="" exit /b 1
          set "PCSX2_NETPLAY_MODE=client"
          set "PCSX2_NETPLAY_HOST=%NETPLAY_HOST%"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_DELAY=2"
          echo ============================================================
          echo PCSX2 Modern Netplay v0.2 - JOIN fallback launcher
          echo Host: %PCSX2_NETPLAY_HOST%:%PCSX2_NETPLAY_PORT%
          echo The host controls the final input-delay value.
          echo ============================================================
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Join.bat

      - name: Upload Windows x64 Netplay build
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-modern-netplay-windows-x64-v0.2
          path: src/bin
          if-no-files-found: error
          retention-days: 14
