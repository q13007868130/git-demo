name: Build PCSX2 Modern Netplay

on:
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: pcsx2-netplay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout build-control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout current PCSX2 master
        uses: actions/checkout@v4
        with:
          repository: PCSX2/pcsx2
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Record upstream revision
        shell: pwsh
        working-directory: src
        run: |
          git rev-parse HEAD | Tee-Object -FilePath ..\control\PCSX2_UPSTREAM_SHA.txt
          git describe --tags --always | Tee-Object -FilePath ..\control\PCSX2_UPSTREAM_VERSION.txt

      - name: Apply Modern Netplay v0.5a synchronized boot preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\pcsx2\Netplay | Out-Null
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.h src\pcsx2\Netplay\ModernNetplay.h -Force
          Copy-Item control\overlay\pcsx2\Netplay\ModernNetplay.cpp src\pcsx2\Netplay\ModernNetplay.cpp -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.h src\pcsx2-qt\NetplayDialog.h -Force
          Copy-Item control\overlay\pcsx2-qt\NetplayDialog.cpp src\pcsx2-qt\NetplayDialog.cpp -Force
          & control\scripts\apply-modern-netplay.ps1 -SourceRoot (Resolve-Path src)
          git -C src diff --check
          git -C src diff -- pcsx2/SIO/Pad/Pad.cpp pcsx2/SIO/Pad/PadDualshock2.cpp pcsx2/VMManager.cpp pcsx2/CMakeLists.txt pcsx2-qt/MainWindow.cpp pcsx2-qt/QtHost.cpp pcsx2-qt/CMakeLists.txt

      - name: Restore PCSX2 Windows dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: src/deps
          key: pcsx2-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Build PCSX2 Windows dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: src
        env:
          DEBUG: 0
        run: .github\workflows\scripts\windows\build-dependencies.bat

      - name: Save PCSX2 Windows dependencies immediately
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/deps
          key: pcsx2-windows-2025-deps-${{ hashFiles('src/.github/workflows/scripts/windows/build-dependencies.bat', 'src/.github/workflows/scripts/common/*.patch') }}

      - name: Download PCSX2 patch database
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path bin\resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/PCSX2/pcsx2_patches/releases/latest/download/patches.zip" -OutFile "bin\resources\patches.zip"

      - name: Configure and build release
        shell: cmd
        working-directory: src
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          call "%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake . -B build "-DCMAKE_PREFIX_PATH=%cd%\deps" -DQT_BUILD=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DDISABLE_ADVANCE_SIMD=ON -G Ninja || exit /b 1
          cmake --build build --config Release || exit /b 1
          cmake --install build --config Release || exit /b 1

      - name: Package Netplay launchers, diagnostics and metadata
        shell: pwsh
        run: |
          Copy-Item control\PCSX2_UPSTREAM_SHA.txt src\bin\PCSX2_UPSTREAM_SHA.txt -Force
          Copy-Item control\PCSX2_UPSTREAM_VERSION.txt src\bin\PCSX2_UPSTREAM_VERSION.txt -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.ps1 src\bin\Collect-Netplay-Diagnostics.ps1 -Force
          Copy-Item control\scripts\Collect-Netplay-Diagnostics.bat src\bin\Collect-Netplay-Diagnostics.bat -Force
          @"
          PCSX2 Modern Netplay v0.5a synchronized boot preview
          =====================================================
          Base: current PCSX2 master at build time (exact SHA in PCSX2_UPSTREAM_SHA.txt)
          Protocol: v2 control protocol + proven v0.1 six-byte DS2 lockstep payload
          Transport: reliable TCP
          Default port: 27886/TCP
          Input delay: host selectable from 1 to 12 frames

          New in this preview:
          - Host selects the game inside the Netplay room from the PCSX2 game list.
          - Game identity is strict Serial + CRC; the client resolves its own local image.
          - Start stays disabled until both peers report the exact same game.
          - PREPARE_BOOT causes both machines to auto-launch their local matching image.
          - Normal/double-click game boot is blocked while a Netplay instance is configured,
            so the synchronized room Start flow cannot be bypassed accidentally.
          - Each VM initializes, reports BOOT_READY, and waits while paused.
          - Host sends START_COMMIT only after both VMs are ready.
          - A second FIRST_POLL barrier holds the first synchronized DS2 poll until both peers arrive.
          - Input stalls >=250ms and >=1000ms are explicitly logged; hard input timeout is 30s.
          - Same v0.1 input lockstep semantics remain after the synchronized start barrier.

          IMPORTANT: memory-card shadow synchronization is not enabled in this preview yet.
          This build isolates synchronized game validation/boot first so its effect on v0.4 desync
          can be tested independently before memory-card transfer is layered on top.

          Test procedure:
          1. Host: 联机 -> 创建房间 -> restart.
          2. Client: 联机 -> 加入房间 -> restart.
          3. Wait until both show 2 / 2.
          4. Host selects one game in “同步游戏启动” and clicks “房主选择并同步此游戏”.
          5. Confirm both rooms show identical Serial/CRC and 本机匹配/对方匹配 ✓.
          6. Host clicks “开始同步游戏”. Do NOT manually double-click a game on either PC.
          7. The faster PC must wait at BOOT_READY until the slower PC finishes loading.
          8. Both must then pass START_COMMIT and FIRST_POLL_GO before gameplay advances.
          9. If anything diverges, run Collect-Netplay-Diagnostics.bat on BOTH PCs and keep both ZIPs.

          No BIOS or game image is included.
          "@ | Set-Content -Encoding UTF8 src\bin\NETPLAY_BUILD_INFO.txt

          @'
          @echo off
          setlocal
          set "PCSX2_NETPLAY_MODE=host"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_DELAY=2"
          set "PCSX2_NETPLAY_SHOW_LOBBY=1"
          echo ============================================================
          echo PCSX2 Modern Netplay v0.5a - HOST fallback launcher
          echo TCP port: %PCSX2_NETPLAY_PORT%   Input delay: %PCSX2_NETPLAY_DELAY%
          echo Use the room to select and synchronously start the game.
          echo ============================================================
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Host.bat

          @'
          @echo off
          setlocal
          set /p "NETPLAY_HOST=Host IPv4 or hostname: "
          if "%NETPLAY_HOST%"=="" exit /b 1
          set "PCSX2_NETPLAY_MODE=client"
          set "PCSX2_NETPLAY_HOST=%NETPLAY_HOST%"
          set "PCSX2_NETPLAY_PORT=27886"
          set "PCSX2_NETPLAY_DELAY=2"
          set "PCSX2_NETPLAY_SHOW_LOBBY=1"
          echo ============================================================
          echo PCSX2 Modern Netplay v0.5a - JOIN fallback launcher
          echo Host: %PCSX2_NETPLAY_HOST%:%PCSX2_NETPLAY_PORT%
          echo Wait for the host to select and synchronously start the game.
          echo ============================================================
          start "" "%~dp0pcsx2-qt.exe"
          endlocal
          '@ | Set-Content -Encoding ASCII src\bin\Netplay-Join.bat

      - name: Upload Windows x64 Netplay build
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-modern-netplay-windows-x64-v0.5a-synchronized-boot-preview
          path: src/bin
          if-no-files-found: error
          retention-days: 14
